name: Sync README from portfolio

on:
  workflow_dispatch:
  # Fired by the portfolio repo after each deploy (event_type: portfolio-updated).
  repository_dispatch:
    types: [portfolio-updated]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/sync_portfolio.py
      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain README.md)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: sync README from portfolio"
            git push
          fi

